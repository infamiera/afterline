name: Build and Publish Afterline Canary

on:
  workflow_dispatch:
  push:
    branches: [ canary ]
  pull_request:
    branches: [ canary ]

permissions:
  contents: write

concurrency:
  group: afterline-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out Canary source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Publish identified Canary Windows x64 build
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Afterline/Afterline.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $sha = $env:GITHUB_SHA.ToLowerInvariant()
          $run = $env:GITHUB_RUN_NUMBER
          $informational = "$version-canary.$run+$run.$sha"

          dotnet publish src/Afterline/Afterline.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:SatelliteResourceLanguages=en `
            -p:InformationalVersion="$informational" `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -o publish/Afterline

      - name: Smoke test Canary startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "publish/Afterline/Afterline.exe"
          $dataRoot = Join-Path $env:LOCALAPPDATA "Afterline"
          $log = Join-Path $dataRoot "Logs/afterline.log"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          '{"FirstRunCompleted":true,"StartMinimized":false,"MinimizeToTray":false,"Editor":null,"Theme":null,"RecentLogPaths":null,"PinnedLogPaths":null}' |
            Set-Content -Path (Join-Path $dataRoot "settings.json") -Encoding utf8
          Remove-Item $log -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "Afterline exited during the initial 5-second startup period with code $($process.ExitCode)."
          }
          $idleCpuStart = $process.TotalProcessorTime
          Start-Sleep -Seconds 10
          $process.Refresh()

          if ($process.HasExited) {
            if (Test-Path $log) {
              Write-Host "--- Afterline diagnostic log ---"
              Get-Content $log
            }
            throw "Afterline exited during the 15-second startup smoke test with code $($process.ExitCode)."
          }

          $idleCpu = ($process.TotalProcessorTime - $idleCpuStart).TotalSeconds
          $workingSetMb = [math]::Round($process.WorkingSet64 / 1MB, 1)
          Write-Host "Idle resource sample: CPU $([math]::Round($idleCpu, 3))s over 10s; working set ${workingSetMb}MB"
          if ($idleCpu -gt 2.0) {
            throw "Afterline consumed $([math]::Round($idleCpu, 3)) CPU seconds during the 10-second disconnected idle sample."
          }
          if ($workingSetMb -gt 400) {
            throw "Afterline used ${workingSetMb}MB during the disconnected idle sample."
          }

          Stop-Process -Id $process.Id -Force

          Add-Type -AssemblyName System.Drawing
          $smokeImage = Join-Path $env:RUNNER_TEMP "afterline-editor-smoke.png"
          $smokeProject = Join-Path $env:RUNNER_TEMP "afterline-editor-smoke.afterlineproj"
          $bitmap = New-Object System.Drawing.Bitmap 64, 64
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::Magenta)
          $graphics.Dispose()
          $bitmap.Save($smokeImage, [System.Drawing.Imaging.ImageFormat]::Png)
          $bitmap.Dispose()

          $imageTest = Start-Process -FilePath $exe `
            -ArgumentList @(
              "--afterline-smoke-image", "`"$smokeImage`"",
              "--afterline-smoke-project", "`"$smokeProject`""
            ) `
            -PassThru
          if (-not $imageTest.WaitForExit(45000)) {
            Stop-Process -Id $imageTest.Id -Force -ErrorAction SilentlyContinue
            throw "Afterline did not finish the Base Image/project round-trip smoke test within 45 seconds."
          }
          if ($imageTest.ExitCode -ne 0) {
            if (Test-Path $log) {
              Write-Host "--- Afterline diagnostic log ---"
              Get-Content $log
            }
            throw "Afterline failed the Base Image/project round-trip smoke test with code $($imageTest.ExitCode)."
          }
          if (-not (Test-Path $smokeProject) -or (Get-Item $smokeProject).Length -le 0) {
            throw "Afterline reported success without producing the Editor project smoke artifact."
          }

          $sessionSmokeRoot = Join-Path $env:RUNNER_TEMP "afterline-session-recovery-smoke"
          $sessionTest = Start-Process -FilePath $exe `
            -ArgumentList @("--afterline-smoke-session-recovery", "`"$sessionSmokeRoot`"") `
            -PassThru
          if (-not $sessionTest.WaitForExit(45000)) {
            Stop-Process -Id $sessionTest.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) {
              Write-Host "--- Afterline diagnostic log ---"
              Get-Content $log
            }
            throw "Afterline did not finish the session-recovery smoke test within 45 seconds."
          }
          if ($sessionTest.ExitCode -ne 0) {
            if (Test-Path $log) {
              Write-Host "--- Afterline diagnostic log ---"
              Get-Content $log
            }
            throw "Afterline failed the session-recovery smoke test with code $($sessionTest.ExitCode)."
          }

      - name: Stress test 10,000-chatlog archive
        shell: pwsh
        run: |
          $exe = Resolve-Path "publish/Afterline/Afterline.exe"
          $stressRoot = Join-Path $env:RUNNER_TEMP "afterline-archive-stress"
          $log = Join-Path $env:LOCALAPPDATA "Afterline/Logs/afterline.log"
          $stressTest = Start-Process -FilePath $exe `
            -ArgumentList @("--afterline-smoke-archive-stress", "`"$stressRoot`"") `
            -PassThru
          if (-not $stressTest.WaitForExit(120000)) {
            Stop-Process -Id $stressTest.Id -Force -ErrorAction SilentlyContinue
            throw "Afterline did not finish the 10,000-chatlog archive stress test within 120 seconds."
          }
          if ($stressTest.ExitCode -ne 0) {
            if (Test-Path $log) {
              Write-Host "--- Afterline diagnostic log ---"
              Get-Content $log
            }
            throw "Afterline failed the 10,000-chatlog archive stress test with code $($stressTest.ExitCode)."
          }
          if (Test-Path $log) {
            Get-Content $log | Select-String "Archive stress test passed"
          }

      - name: Smoke test transactional updater
        shell: pwsh
        run: |
          $exe = Resolve-Path "publish/Afterline/Afterline.exe"
          $testRoot = Join-Path $env:RUNNER_TEMP "afterline-updater-transaction"
          $log = Join-Path $env:LOCALAPPDATA "Afterline/Logs/afterline.log"
          $updateTest = Start-Process -FilePath $exe `
            -ArgumentList @("--afterline-smoke-update-transaction", "`"$testRoot`"") `
            -PassThru
          if (-not $updateTest.WaitForExit(45000)) {
            Stop-Process -Id $updateTest.Id -Force -ErrorAction SilentlyContinue
            throw "Afterline did not finish the transactional updater smoke test within 45 seconds."
          }
          if ($updateTest.ExitCode -ne 0) {
            if (Test-Path $log) {
              Write-Host "--- Afterline diagnostic log ---"
              Get-Content $log
            }
            throw "Afterline failed the transactional updater smoke test with code $($updateTest.ExitCode)."
          }

      - name: Prepare uniquely identified Canary assets
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Afterline/Afterline.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $sha = $env:GITHUB_SHA.ToLowerInvariant()
          $shortSha = $sha.Substring(0, 7)
          $run = $env:GITHUB_RUN_NUMBER
          $exeName = "Afterline-v$version-Canary-$run-$shortSha-Windows-x64.exe"

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exePath = Join-Path release $exeName
          Copy-Item publish/Afterline/Afterline.exe $exePath
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $exeName" | Set-Content -Path "$exePath.sha256" -Encoding ascii -NoNewline

          $releaseNotes = "Automated Afterline Canary build #$run from commit $sha.`n`nBuild identity: $run.$sha`n`nWarning: Canary builds are experimental, may update frequently, and can contain unfinished or broken changes."
          $manifest = [ordered]@{
            schemaVersion = 1
            version = [string]$version
            buildNumber = [int]$run
            commitSha = $sha
            executable = $exeName
            checksum = "$exeName.sha256"
            releaseNotes = $releaseNotes
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -Path "release/afterline-canary-update.json" -Encoding utf8

      - name: Smoke test Canary update manifest
        shell: pwsh
        run: |
          $exe = Resolve-Path "publish/Afterline/Afterline.exe"
          $manifest = Resolve-Path "release/afterline-canary-update.json"
          $log = Join-Path $env:LOCALAPPDATA "Afterline/Logs/afterline.log"
          $manifestTest = Start-Process -FilePath $exe `
            -ArgumentList @("--afterline-smoke-canary-manifest", "`"$manifest`"") `
            -PassThru
          if (-not $manifestTest.WaitForExit(30000)) {
            Stop-Process -Id $manifestTest.Id -Force -ErrorAction SilentlyContinue
            throw "Afterline did not finish the Canary update-manifest smoke test within 30 seconds."
          }
          if ($manifestTest.ExitCode -ne 0) {
            if (Test-Path $log) {
              Write-Host "--- Afterline diagnostic log ---"
              Get-Content $log
            }
            throw "Afterline failed the Canary update-manifest smoke test with code $($manifestTest.ExitCode)."
          }

      - name: Upload identified Canary build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Afterline-Canary-Windows-x64
          path: release/*
          if-no-files-found: error
          compression-level: 9

      - name: Publish identified Canary prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/canary'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$project = Get-Content src/Afterline/Afterline.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $sha = $env:GITHUB_SHA.ToLowerInvariant()
          $shortSha = $sha.Substring(0, 7)
          $run = $env:GITHUB_RUN_NUMBER
          $exeName = "Afterline-v$version-Canary-$run-$shortSha-Windows-x64.exe"

          $notes = "Automated Afterline Canary build #$run from commit $sha.`n`nBuild identity: $run.$sha`n`nWarning: Canary builds are experimental, may update frequently, and can contain unfinished or broken changes."
          gh release view canary *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if (-not $releaseExists) {
            gh release create canary `
              "release/$exeName" `
              "release/$exeName.sha256" `
              "release/afterline-canary-update.json" `
              --target "$env:GITHUB_SHA" `
              --title "Afterline $version Canary #$run · $shortSha" `
              --notes "$notes" `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Unable to create the Canary prerelease." }
            exit 0
          }

          # Keep the old manifest and its assets valid until the complete new pair
          # exists. The fixed manifest is switched last, avoiding a release blackout.
          gh release upload canary "release/$exeName" "release/$exeName.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload the identified Canary assets." }
          gh release upload canary "release/afterline-canary-update.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to switch the Canary update manifest." }

          gh api --method PATCH `
            "repos/$env:GITHUB_REPOSITORY/git/refs/tags/canary" `
            -f "sha=$sha" -F "force=true" *> $null
          if ($LASTEXITCODE -ne 0) { throw "Unable to move the Canary tag to the published commit." }

          gh release edit canary `
            --target "$sha" `
            --title "Afterline $version Canary #$run · $shortSha" `
            --notes "$notes" `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Unable to update the Canary prerelease details." }

          # Retain the current and immediately previous executable/checksum pairs.
          # Cached old manifests and downloads therefore remain valid across a publish.
          $release = gh release view canary --json assets | ConvertFrom-Json
          $identified = @($release.assets | ForEach-Object {
            $match = [regex]::Match($_.name, '^Afterline-v.+-Canary-(\d+)-[0-9a-f]+-Windows-x64\.exe$')
            if ($match.Success) {
              [pscustomobject]@{ Name = $_.name; Run = [int]$match.Groups[1].Value }
            }
          } | Sort-Object Run -Descending)
          $keep = @($identified | Select-Object -First 2 | ForEach-Object { $_.Name })
          $keepChecksums = @($keep | ForEach-Object { "${_}.sha256" })
          foreach ($asset in $release.assets) {
            if ($asset.name -eq 'afterline-canary-update.json' -or
                $keep -contains $asset.name -or
                $keepChecksums -contains $asset.name) {
              continue
            }
            if ($asset.name -match '^Afterline-v.+-Canary-\d+-[0-9a-f]+-Windows-x64\.exe(?:\.sha256)?$') {
              gh release delete-asset canary $asset.name --yes
              if ($LASTEXITCODE -ne 0) { throw "Unable to remove stale Canary asset $($asset.name)." }
            }
          }
