name: Build Afterline for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file Windows x64 build
        shell: pwsh
        run: |
          dotnet publish src/Afterline/Afterline.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:SatelliteResourceLanguages=en `
            -o publish/Afterline

      - name: Upload Afterline application
        uses: actions/upload-artifact@v4
        with:
          name: Afterline-v0.2.5-Windows-x64
          path: publish/Afterline/Afterline.exe
          if-no-files-found: error
          compression-level: 9
