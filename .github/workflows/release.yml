name: Publish Afterline Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Afterline/Afterline.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match project version '$expected'."
          }

      - name: Publish single-file Windows x64 release
        shell: pwsh
        run: |
          dotnet publish src/Afterline/Afterline.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:PublishReadyToRun=false `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:SatelliteResourceLanguages=en `
            -o publish/Afterline

      - name: Prepare release assets and checksum
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Afterline/Afterline.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exeName = "Afterline-v$version-Windows-x64.exe"
          $exePath = Join-Path release $exeName
          Copy-Item publish/Afterline/Afterline.exe $exePath
          $hash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $exeName" | Set-Content -Path "$exePath.sha256" -Encoding ascii -NoNewline

      - name: Create descriptive GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [xml]$project = Get-Content src/Afterline/Afterline.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $releaseTitle = $project.Project.PropertyGroup.ReleaseTitle | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($releaseTitle)) {
            $releaseTitle = "Stable Release"
          }
          $exeName = "Afterline-v$version-Windows-x64.exe"
          gh release create "$env:GITHUB_REF_NAME" `
            "release/$exeName" `
            "release/$exeName.sha256" `
            --verify-tag `
            --title "Afterline $version — $releaseTitle" `
            --generate-notes
